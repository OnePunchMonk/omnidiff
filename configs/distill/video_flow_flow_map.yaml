# Flow-map distillation on the moving-blob video teacher.
seed: 0
device: auto
output_dir: runs/distill/video_flow_flow_map
teacher: runs/video_flow_grpo/sft/final     # produced by: diffusion-omni sft -c configs/video_flow_grpo.yaml

distill:
  method: {type: flow_map, equal_ratio: 0.25}
  student_steps: 4
  data: teacher
  steps: 2000
  batch_size: 32
  lr: 1e-4
  eval_every: 500
