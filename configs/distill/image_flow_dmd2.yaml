# DMD2: 4-step student, 5 fake-score updates per student update, backward simulation, data-free.
seed: 0
device: auto
output_dir: runs/distill/image_flow_dmd2
teacher: runs/image_flow_grpo/sft/final     # produced by: omnidiff sft -c configs/image_flow_grpo.yaml

distill:
  method: {type: dmd2, fake_updates: 5, gan_weight: 0.0, last_stage_prob: 0.5}
  student_steps: 4
  data: teacher
  steps: 600
  batch_size: 32
  lr: 2e-5
  betas: [0.0, 0.999]
  eval_every: 200
