# Consistency distillation (iCT-style: stop-gradient target, pseudo-Huber), sampled with 4 renoise steps.
seed: 0
device: auto
output_dir: runs/distill/video_flow_consistency
teacher: runs/video_flow_grpo/sft/final     # produced by: diffusion-omni sft -c configs/video_flow_grpo.yaml

distill:
  method: {type: consistency, num_intervals: 32, target: stopgrad}
  student_steps: 4
  data: teacher
  steps: 2000
  batch_size: 32
  lr: 1e-4
  eval_every: 500
