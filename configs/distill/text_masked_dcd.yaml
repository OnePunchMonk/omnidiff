# Single-mask discrete consistency distillation (an ablation; not the multi-mask scheme of
# 2607.19686) for masked diffusion: the student's clean-token prediction at x_t
# is matched (KL) to the EMA target's prediction after 2 teacher ancestral steps to a random s < t;
# s = 0 anchors it to the teacher's tokens.
seed: 0
device: auto
output_dir: runs/distill/text_masked_dcd
teacher: runs/text_masked_grpo/sft/final     # produced by: omnidiff sft -c configs/text_masked_grpo.yaml

distill:
  method: {type: dcd, sub_steps: 2, boundary_prob: 0.25, target_decay: 0.95}
  student_steps: 4
  data: text_lines
  steps: 3000
  batch_size: 64
  lr: 1e-4
  eval_every: 1000
