# Progressive distillation on the Gaussian (VP, epsilon) teacher: 16 -> 8 -> 4 -> 2 steps. The loss is in x0 space, as in the paper.
seed: 0
device: auto
output_dir: runs/distill/image_ddpm_progressive
teacher: runs/image_ddpm_ddpo/sft/final     # produced by: omnidiff sft -c configs/image_ddpm_ddpo.yaml

distill:
  method: {type: progressive, start_steps: 16, rounds: 3}
  data: teacher
  steps: 2400
  batch_size: 32
  lr: 5e-5
  eval_every: 600
