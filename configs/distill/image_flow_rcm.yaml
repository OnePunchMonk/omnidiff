# rCM-style: continuous-time consistency (flow-map objective with s = 0) + DMD2 regulariser.
seed: 0
device: auto
output_dir: runs/distill/image_flow_rcm
teacher: runs/image_flow_grpo/sft/final     # produced by: omnidiff sft -c configs/image_flow_grpo.yaml

distill:
  method: {type: rcm, dmd_weight: 0.1, fake_updates: 5, s_mode: zero}
  student_steps: 4
  data: teacher
  steps: 600
  batch_size: 32
  lr: 5e-5
  betas: [0.0, 0.999]
  eval_every: 200
