# DMD2 + reward gradient: channel 0 dominance, as in configs/image_flow_grpo.yaml's rl.reward.
seed: 0
device: auto
output_dir: runs/distill/image_flow_dmd2_reward
teacher: runs/image_flow_grpo/sft/final     # produced by: omnidiff sft -c configs/image_flow_grpo.yaml

distill:
  method:
    type: dmd2_reward
    fake_updates: 5
    gan_weight: 0.0
    last_stage_prob: 0.5
    mode: gradient
    reward_weight: 1.0
    reward: {type: channel_dominance, channel: 0}
  student_steps: 4
  data: teacher
  steps: 600
  batch_size: 32
  lr: 2e-5
  betas: [0.0, 0.999]
  eval_every: 200
