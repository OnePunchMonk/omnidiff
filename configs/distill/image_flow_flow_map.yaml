# Flow-map (MeanFlow-identity) distillation: one two-time student for any step count.
seed: 0
device: auto
output_dir: runs/distill/image_flow_flow_map
teacher: runs/image_flow_grpo/sft/final     # produced by: omnidiff sft -c configs/image_flow_grpo.yaml

distill:
  method: {type: flow_map, equal_ratio: 0.25, derivative: jvp}
  student_steps: 4
  data: teacher
  steps: 2000
  batch_size: 64
  lr: 1e-4
  eval_every: 500
