# Same data with Gaussian (VP, epsilon-prediction) diffusion, then DDPO
# (full fine-tune, batch-normalised advantages) towards brighter images.
seed: 0
device: auto
output_dir: runs/image_ddpm_ddpo
sample_shape: [3, 16, 16]

codec: pixel
process: {type: gaussian, schedule: vp_linear, eta: 1.0}
model:
  dim: 128
  adapter: {type: image_patch, patch: 2}
  backbone: {type: dit, depth: 4, heads: 4}
  conditioner: {type: class, num_classes: 4}
prompts: {type: class, num_classes: 4}
sampling: {num_steps: 20, guidance_scale: 1.0}

sft:
  dataset: {type: blobs, num_classes: 4}
  steps: 2000
  batch_size: 64
  lr: 3e-4

rl:
  init_from: runs/image_ddpm_ddpo/sft/final
  algorithm: {type: ddpo, clip_range: 1e-4}
  reward: {type: brightness}
  epochs: 40
  prompts_per_epoch: 16
  group_size: 4
  rollout_batch_size: 64
  train_batch_size: 32
  timestep_fraction: 0.5
  lr: 1e-4
