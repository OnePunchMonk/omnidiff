[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "omnidiff-reward"
version = "0.1.0"
description = "Reward functions and (planned) the reward/eval harness."
requires-python = ">=3.10"
dependencies = ["omnidiff-core", "omnidiff-data"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnidiff"]

[project.entry-points."omnidiff.plugins"]
reward = "omnidiff.reward"

[project.entry-points."omnidiff.commands"]
reward = "omnidiff.reward.cli:register"
