[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diffusion-omni-reward"
version = "0.1.0"
description = "Reward functions and (planned) the reward/eval harness."
requires-python = ">=3.10"
dependencies = ["diffusion-omni-core", "diffusion-omni-data"]

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_omni"]

[project.entry-points."diffusion_omni.plugins"]
reward = "diffusion_omni.reward"

[project.entry-points."diffusion_omni.commands"]
reward = "diffusion_omni.reward.cli:register"
