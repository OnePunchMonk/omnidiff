[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diffusion-omni-posttrain"
version = "0.1.0"
description = "SFT and online RL (GRPO, DDPO) for text, image and video diffusion."
requires-python = ">=3.10"
dependencies = ["diffusion-omni-core", "diffusion-omni-data", "diffusion-omni-reward"]

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_omni"]

[project.entry-points."diffusion_omni.plugins"]
posttrain = "diffusion_omni.posttrain"

[project.entry-points."diffusion_omni.commands"]
posttrain = "diffusion_omni.posttrain.cli:register"
