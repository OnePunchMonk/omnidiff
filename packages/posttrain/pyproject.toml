[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "omnidiff-posttrain"
version = "0.1.0"
description = "SFT and online RL (GRPO, DDPO) for text, image and video diffusion."
requires-python = ">=3.10"
dependencies = ["omnidiff-core", "omnidiff-data", "omnidiff-reward"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnidiff"]

[project.entry-points."omnidiff.plugins"]
posttrain = "omnidiff.posttrain"

[project.entry-points."omnidiff.commands"]
posttrain = "omnidiff.posttrain.cli:register"
