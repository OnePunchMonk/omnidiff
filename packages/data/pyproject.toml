[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diffusion-omni-data"
version = "0.1.0"
description = "Data sources for SFT and distillation."
requires-python = ">=3.10"
dependencies = ["diffusion-omni-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_omni"]

[project.entry-points."diffusion_omni.plugins"]
data = "diffusion_omni.data"
