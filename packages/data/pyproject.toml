[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "omnidiff-data"
version = "0.1.0"
description = "Data sources for SFT and distillation."
requires-python = ">=3.10"
dependencies = ["omnidiff-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnidiff"]

[project.entry-points."omnidiff.plugins"]
data = "omnidiff.data"
