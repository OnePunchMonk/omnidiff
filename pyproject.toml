# uv workspace root. `uv sync` installs every package under packages/ in editable mode.
[project]
name = "diffusion-omni-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["diffusion-omni-core", "diffusion-omni-data", "diffusion-omni-reward", "diffusion-omni-posttrain", "diffusion-omni-distill"]

[dependency-groups]
dev = ["pytest>=8", "safetensors"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
diffusion-omni-core = { workspace = true }
diffusion-omni-data = { workspace = true }
diffusion-omni-reward = { workspace = true }
diffusion-omni-posttrain = { workspace = true }
diffusion-omni-distill = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]
