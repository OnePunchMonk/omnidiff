[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidiff"
version = "0.1.0"
description = "RL post-training and inference for language, image and video diffusion models in plain PyTorch + NumPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omnidiff = "omnidiff.cli:main"

[tool.setuptools.packages.find]
include = ["omnidiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
