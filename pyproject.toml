# uv workspace root. `uv sync` installs every package under packages/ in editable mode.
[project]
name = "omnidiff-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["omnidiff-core", "omnidiff-data", "omnidiff-reward", "omnidiff-posttrain", "omnidiff-distill"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
omnidiff-core = { workspace = true }
omnidiff-data = { workspace = true }
omnidiff-reward = { workspace = true }
omnidiff-posttrain = { workspace = true }
omnidiff-distill = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]
